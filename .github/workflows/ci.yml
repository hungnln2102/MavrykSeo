name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Lint, typecheck, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
      DATABASE_URL: postgresql://seo:seo@localhost:5432/seo_platform

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: seo
          POSTGRES_PASSWORD: seo
          POSTGRES_DB: seo_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U seo -d seo_platform"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate migration metadata
        run: pnpm db:check

      - name: Verify migrations and demo seed are idempotent
        env:
          DEMO_SEED_CONFIRMATION: seed-demo
        run: |
          pnpm db:migrate
          pnpm db:migrate
          pnpm db:seed
          pnpm db:seed

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test deterministic checks
        run: pnpm test

      - name: Build
        run: pnpm build