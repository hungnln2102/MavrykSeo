groups:
  - name: mavrykseo-job-operations
    rules:
      - alert: MavrykSeoJobDeadLettered
        expr: increase(job_dead_letter_total[15m]) > 0
        for: 5m
        labels:
          severity: warning
          service: worker
        annotations:
          summary: 'A MAVRYKSEO workload reached durable dead-letter state'
          description: 'Inspect queue={{ $labels.queue }}, job={{ $labels.job_name }}, error_code={{ $labels.error_code }}. Follow docs/runbooks/INCIDENT-RUNBOOK.md before replaying.'
