name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  security:
    name: Secret, dependency, and container security scans
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan committed secrets
        uses: gitleaks/gitleaks-action@v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan dependency vulnerabilities
        uses: aquasecurity/trivy-action@0.33.1
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Scan container and Compose misconfigurations
        uses: aquasecurity/trivy-action@0.33.1
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: '1'

  quality:
    name: Lint, typecheck, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
      DATABASE_URL: postgresql://seo:seo@localhost:5432/seo_platform

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: seo
          POSTGRES_PASSWORD: seo
          POSTGRES_DB: seo_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U seo -d seo_platform"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate migration metadata
        run: pnpm db:check

      - name: Verify migrations and demo seed are idempotent
        env:
          DEMO_SEED_CONFIRMATION: seed-demo
        run: |
          pnpm db:migrate
          pnpm db:migrate
          pnpm db:seed
          pnpm db:seed

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test deterministic checks
        run: pnpm test

      - name: Install Chromium for responsive browser tests
        run: pnpm exec playwright install --with-deps chromium

      - name: Test responsive browser coverage
        run: pnpm exec playwright test

      - name: Build
        run: pnpm build
